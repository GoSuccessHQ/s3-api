name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, dom, mbstring, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Code style (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (phpstan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Tests (phpunit)
        run: vendor/bin/phpunit --testsuite unit

      - name: Start RustFS
        run: composer rustfs:start

      - name: Integration tests against RustFS
        run: vendor/bin/phpunit --testsuite integration
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9100
